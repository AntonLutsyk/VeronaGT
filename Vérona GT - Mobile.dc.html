<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:clamp(24px,4vh,48px);padding:clamp(28px,5vh,64px) clamp(16px,4vw,48px) clamp(48px,8vh,96px);background:#08080A;font-family:Archivo,'Helvetica Neue',Helvetica,sans-serif">
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
    <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#C6A76A">Preview — 390 × 844</span>
    <span style="font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.02em;color:#FBFAF7">Vérona GT Coupé, mobile</span>

  <div style="position:relative;width:414px;max-width:100%;flex:0 0 auto">

      <div style="position:relative;width:100%;aspect-ratio:390 / 844;overflow:hidden;background:#08080A">
        <iframe src="VÉRONA GT Coupé.dc.html" title="Vérona GT Coupé mobile" style="position:absolute;top:0;left:0;width:390px;height:844px;border:0;transform-origin:top left" ref="{{ frameRef }}"></iframe>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px">

      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  frameRef = React.createRef();
  componentDidMount() {
    const f = this.frameRef.current;
    if (f && f.parentElement) {
      this.ro = new ResizeObserver(this.fit);
      this.ro.observe(f.parentElement);
    }
    requestAnimationFrame(this.fit);
    addEventListener("resize", this.fit);
    this.hideFrameScrollbar();
    f && f.addEventListener("load", this.hideFrameScrollbar);
  }
  componentWillUnmount() {
    removeEventListener("resize", this.fit);
    this.ro && this.ro.disconnect();
  }
  // the emulated viewport must be a true 390px — a visible scrollbar would
  // lay the page out 15px narrower than the device it claims to be
  hideFrameScrollbar = () => {
    const f = this.frameRef.current;
    try {
      const d = f.contentDocument;
      if (!d) return;
      let s = d.getElementById("v-hide-sb");
      if (!s) {
        s = d.createElement("style");
        s.id = "v-hide-sb";
        s.textContent = "html{scrollbar-width:none}html::-webkit-scrollbar{display:none}";
        d.head.appendChild(s);
      }
    } catch (e) {}
  };
  fit = () => {
    const f = this.frameRef.current;
    if (!f || !f.parentElement) return;
    const w = f.parentElement.clientWidth;
    if (!w) return;
    f.style.transform = "scale(" + (w / 390) + ")";
  };
  renderVals() { return { frameRef: this.frameRef }; }
}
</script>
